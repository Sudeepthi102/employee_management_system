{% extends "base.html" %}

{% block title %}
Edit Employee | EmployeeHub
{% endblock %}


{% block content %}

<section class="form-page">

    <div class="page-heading">

        <div>

            <p class="eyebrow">
                EMPLOYEE MANAGEMENT
            </p>

            <h1>
                Edit Employee
            </h1>

            <p>
                Update employee information.
            </p>

        </div>


        <a
            href="{{ url_for('employees') }}"
            class="secondary-button">

            ← Back

        </a>

    </div>


    <form
        method="POST"
        class="form-card">


        <div class="form-section-title">

            <span>01</span>

            <div>

                <h2>
                    Employee Details
                </h2>

                <p>
                    Update the employee information.
                </p>

            </div>

        </div>


        <div class="form-grid">


            <div class="input-group">

                <label>
                    Full Name *
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ employee.name }}"
                    required>

            </div>


            <div class="input-group">

                <label>
                    Email *
                </label>

                <input
                    type="email"
                    name="email"
                    value="{{ employee.email }}"
                    required>

            </div>


            <div class="input-group">

                <label>
                    Phone
                </label>

                <input
                    type="tel"
                    name="phone"
                    maxlength="10"
                    value="{{ employee.phone or '' }}">

            </div>


            <div class="input-group">

                <label>
                    Department *
                </label>

                <select
                    name="department"
                    required>

                    <option value="IT"
                        {% if employee.department == "IT" %}
                        selected
                        {% endif %}>
                        IT
                    </option>

                    <option value="HR"
                        {% if employee.department == "HR" %}
                        selected
                        {% endif %}>
                        HR
                    </option>

                    <option value="Finance"
                        {% if employee.department == "Finance" %}
                        selected
                        {% endif %}>
                        Finance
                    </option>

                    <option value="Marketing"
                        {% if employee.department == "Marketing" %}
                        selected
                        {% endif %}>
                        Marketing
                    </option>

                    <option value="Operations"
                        {% if employee.department == "Operations" %}
                        selected
                        {% endif %}>
                        Operations
                    </option>

                </select>

            </div>


            <div class="input-group">

                <label>
                    Salary (₹) *
                </label>

                <input
                    type="number"
                    name="salary"
                    min="0"
                    step="0.01"
                    value="{{ employee.salary }}"
                    required>

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('employees') }}"
                class="secondary-button">

                Cancel

            </a>


            <button
                type="submit"
                class="primary-button">

                Update Employee →

            </button>

        </div>

    </form>

</section>

{% endblock %}
